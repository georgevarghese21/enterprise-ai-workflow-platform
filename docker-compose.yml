services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: novatech
      POSTGRES_PASSWORD: novatech
      POSTGRES_DB: novatech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatech -d novatech"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://novatech:novatech@postgres:5432/novatech
      LLM_MODE: mock
      # host.docker.internal (below, via extra_hosts) lets the container reach
      # an Ollama server running on the host when LLM_MODE=ollama is set.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.db.seed && python -m app.rag.ingest && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
